name: Build Prompt Index

on:
  push:
    paths:
      - "library/prompts/**"
      - "tools/build_prompts.py"
      - ".github/workflows/build-prompts.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prompts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Generate prompts.json
        run: python tools/build_prompts.py

      - name: Commit generated prompt index
        run: |
          if git diff --quiet -- library/prompts.json; then
            echo "No changes to prompts.json."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add library/prompts.json
          git commit -m "Auto-generate prompts index"
          git push origin HEAD:${{ github.ref_name }}